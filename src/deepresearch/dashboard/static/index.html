<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research // Workstation</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f59e0b'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="btn ghost mnav l" id="btn-left" title="Archive" aria-label="Show archive">&#9776;</button>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" /><circle cx="16" cy="16" r="8" />
        <circle class="core" cx="16" cy="16" r="3" />
        <line x1="16" y1="1" x2="16" y2="6" /><line x1="16" y1="26" x2="16" y2="31" />
        <line x1="1" y1="16" x2="6" y2="16" /><line x1="26" y1="16" x2="31" y2="16" />
      </svg>
      <div>
        <div class="brand-name">DEEP&nbsp;RESEARCH</div>
        <div class="brand-sub">analyst workstation <span id="version"></span></div>
      </div>
    </div>
    <div class="telemetry" id="telemetry"></div>
    <div class="top-actions">
      <button class="btn ghost" id="btn-palette" title="Command palette (Ctrl+K)">
        <span class="kbd">Ctrl K</span> Commands
      </button>
      <button class="btn ghost mnav r" id="btn-right" title="Inspector" aria-label="Show inspector">Intel</button>
      <button class="btn primary" id="btn-new">+<span class="lbl"> New research</span></button>
    </div>
  </header>

  <div class="layout">

    <!-- LEFT: archive -->
    <aside class="panel left" id="left">
      <div class="panel-head">
        <span class="label">Archive</span>
        <div class="seg" id="filter-seg">
          <button data-f="all" class="on">All</button>
          <button data-f="running">Live</button>
          <button data-f="starred">&#9733;</button>
          <button data-f="failed">Fail</button>
        </div>
      </div>
      <div class="search-box">
        <input id="q" type="search" placeholder="Filter prompts and reports..." autocomplete="off">
      </div>
      <div class="toggle-row">
        <label><input type="checkbox" id="roots-only" checked> Top-level only</label>
        <span id="count" class="dim"></span>
      </div>
      <div class="session-list" id="session-list"></div>
    </aside>

    <!-- CENTER: work area -->
    <main class="center">
      <nav class="tabs" id="tabs"></nav>
      <section class="stage" id="stage"></section>
    </main>

    <!-- RIGHT: inspector -->
    <aside class="panel right" id="right">
      <nav class="rtabs" id="rtabs">
        <button data-r="info" class="on">Intel</button>
        <button data-r="notes">Notes</button>
        <button data-r="outline">Outline</button>
        <button data-r="log">Live log</button>
      </nav>
      <div class="rbody" id="rbody"></div>
    </aside>

  </div>

  <div class="scrim" id="scrim"></div>

  <footer class="statusbar">
    <span id="sb-left">ready</span>
    <span class="sb-right" id="sb-right"></span>
  </footer>
</div>

<!-- Selection toolbar -->
<div class="selbar" id="selbar" hidden>
  <button data-act="copy" title="Copy">Copy</button>
  <button data-act="quote" title="Send to notebook as a cited quote">&rarr; Notebook</button>
  <span class="sep"></span>
  <button data-act="hl" data-color="amber" class="sw amber" title="Highlight"></button>
  <button data-act="hl" data-color="cyan" class="sw cyan" title="Highlight"></button>
  <button data-act="hl" data-color="magenta" class="sw magenta" title="Highlight"></button>
  <button data-act="hl" data-color="green" class="sw green" title="Highlight"></button>
  <button data-act="note" title="Highlight and add a note">+ Note</button>
  <button data-act="ask" title="Ask a follow-up about this passage">Ask</button>
</div>

<div class="modal-back" id="modal-back" hidden>
  <div class="modal" id="modal"></div>
</div>

<div class="palette-back" id="palette-back" hidden>
  <div class="palette">
    <input id="palette-input" placeholder="Type a command or search sessions..." autocomplete="off">
    <div id="palette-list"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/features.js"></script>
<script src="/app.js"></script>
</body>
</html>

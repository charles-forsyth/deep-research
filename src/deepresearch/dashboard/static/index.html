<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Research</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f59e0b'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="btn ghost mnav l" id="btn-left" title="Reports" aria-label="Show reports">&#9776;</button>
    <div class="brand" title="Deep Research">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" /><circle cx="16" cy="16" r="8" />
        <circle class="core" cx="16" cy="16" r="3" />
      </svg>
      <span class="brand-name">Deep Research</span>
    </div>
    <button class="ws-switch" id="ws-switch" hidden aria-haspopup="dialog"><span class="ws-dot"></span><span class="ws-name"></span><span class="ws-caret" aria-hidden="true">&#9662;</span></button>
    <button class="gsearch" id="btn-palette" title="Search reports or run a command (Ctrl+K)">
      <span class="gs-ico" aria-hidden="true">&#8981;</span><span class="gs-t"><span class="gs-long">Search reports or run a command</span><span class="gs-short">Search</span></span><span class="kbd">Ctrl K</span>
    </button>
    <div class="top-actions">
      <span class="keywarn" id="keywarn" hidden></span>
      <button class="activity" id="activity" hidden aria-haspopup="dialog"></button>
      <button class="btn primary" id="btn-new">+<span class="lbl"> New</span></button>
    </div>
  </header>

  <div class="layout">

    <!-- LEFT: navigation and reports -->
    <aside class="panel left" id="left">
      <nav class="sidenav" id="sidenav" aria-label="Pages">
        <button class="nav-row" data-nav="home"><span class="ni" aria-hidden="true">&#9678;</span>Home</button>
        <button class="nav-row" data-nav="projects" id="btn-projects"><span class="ni" aria-hidden="true">&#9635;</span>Projects</button>
        <button class="nav-row" data-nav="labruns" id="btn-labruns"><span class="ni" aria-hidden="true">&#9879;</span>Lab<span class="nb-count" id="nav-lab-n" hidden></span></button>
        <button class="nav-row nav-sub" data-nav="cluster" id="btn-cluster"><span class="ni" aria-hidden="true">&#9638;</span>Cluster</button>
        <button class="nav-row" data-nav="notes" id="btn-notes"><span class="ni" aria-hidden="true">&#9998;</span>Notes</button>
        <button class="nav-row" data-nav="sources" id="btn-sources"><span class="ni" aria-hidden="true">&#9638;</span>Sources</button>
      </nav>
      <div class="side-h"><span>Reports</span><span class="grow"></span><span id="count" class="dim"></span></div>
      <div class="search-box">
        <input id="q" type="search" placeholder="Filter reports" autocomplete="off" aria-label="Filter reports">
        <button class="icon-btn filt-btn" id="filt-btn" title="Filter: status, projects, sub-reports" aria-haspopup="menu" aria-label="Filter options">&#9776;</button>
      </div>
      <div class="filt-chips" id="filt-chips"></div>
      <div class="proj-strip" id="proj-strip" hidden></div>
      <div class="session-list" id="session-list"></div>
      <div class="side-foot">
        <button class="nav-row" data-nav="settings" id="btn-settings"><span class="ni" aria-hidden="true">&#9881;</span>Settings</button>
      </div>
    </aside>

    <!-- CENTER: work area -->
    <main class="center">
      <nav class="tabs" id="tabs"></nav>
      <section class="stage" id="stage"></section>
    </main>

    <!-- RIGHT: info sheet (closed by default) -->
    <aside class="panel right" id="right" aria-label="Report info">
      <nav class="rtabs" id="rtabs">
        <button data-r="info" class="on">Details</button>
        <button data-r="notes">Notes</button>
        <button data-r="outline">Outline</button>
        <button data-r="log">Live log</button>
        <button class="icon-btn rclose" id="btn-right" title="Close (i)" aria-label="Close info">&#10005;</button>
      </nav>
      <div class="rbody" id="rbody"></div>
    </aside>

  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-tb="home"><span aria-hidden="true">&#9678;</span>Home</button>
    <button data-tb="reports"><span aria-hidden="true">&#9776;</span>Reports</button>
    <button data-tb="lab"><span aria-hidden="true">&#9879;</span>Lab</button>
    <button data-tb="new" class="tb-new"><span aria-hidden="true">+</span>New</button>
  </nav>

  <div class="scrim" id="scrim"></div>

  <div class="statuspill" id="sb-left" hidden></div>
</div>

<!-- Selection toolbar -->
<div class="selbar" id="selbar" hidden>
  <button data-act="copy" title="Copy">Copy</button>
  <button data-act="quote" title="Send to notebook as a cited quote">&rarr; Notebook</button>
  <span class="sep"></span>
  <button data-act="hl" data-color="amber" title="Highlight (amber)"><span class="sw amber"></span> Highlight</button>
  <button data-act="more" class="sel-more" title="Other highlight colors" aria-label="Other highlight colors">&#9662;</button>
  <span class="sel-colors" hidden>
    <button data-act="hl" data-color="cyan" class="sw cyan" title="Highlight (cyan)"></button>
    <button data-act="hl" data-color="magenta" class="sw magenta" title="Highlight (magenta)"></button>
    <button data-act="hl" data-color="green" class="sw green" title="Highlight (green)"></button>
  </span>
  <button data-act="note" title="Highlight and add a note">Note</button>
  <button data-act="ask" title="Ask a follow-up about this passage">Ask</button>
  <button data-act="lab" title="Plan a real computation on the cluster from this passage">&#9879; Lab run</button>
</div>

<div class="modal-back" id="modal-back" hidden>
  <div class="modal" id="modal" tabindex="-1"></div>
</div>

<div class="palette-back" id="palette-back" hidden>
  <div class="palette">
    <input id="palette-input" placeholder="Type a command or search sessions..." autocomplete="off">
    <div id="palette-list"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/features.js"></script>
<script src="/sources.js"></script>
<script src="/filebrowser.js"></script>
<script src="/lab.js"></script>
<script src="/cluster.js"></script>
<script src="/projects.js"></script>
<script src="/workspaces.js"></script>
<script src="/actions.js"></script>
<script src="/app.js"></script>
</body>
</html>

name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove API keys and any private research content before posting.
        Security problems go through private reporting instead: see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (research, start, list, show, followup, search ...)
        - Web dashboard
        - Audio / read aloud
        - Installation / setup
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. deep-research ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `deep-research --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Ubuntu 24.04, Python 3.12.3, Chrome 140 (for dashboard issues)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From the terminal or `~/.config/deepresearch/logs/`. Rendered as code.
      render: text

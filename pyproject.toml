[project]
name = "deepresearch"
version = "0.17.2"
description = "CLI and self-hosted web workstation for Google's Gemini Deep Research agent: launch, watch, read, annotate, search and listen to cited research reports."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Forsyth" }]
keywords = ["gemini", "deep-research", "research-agent", "llm", "cli", "dashboard", "rag", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "google-genai>=2.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
]

[project.urls]
Homepage = "https://github.com/charles-forsyth/deep-research"
Documentation = "https://github.com/charles-forsyth/deep-research#readme"
Changelog = "https://github.com/charles-forsyth/deep-research/blob/main/CHANGELOG.md"
Issues = "https://github.com/charles-forsyth/deep-research/issues"

[project.scripts]
deep-research = "deepresearch:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
deepresearch = ["dashboard/static/*", "dashboard/static/vendor/*"]

[tool.ruff.lint]
ignore = ["E402"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
